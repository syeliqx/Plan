<html lang="en">
<head>

<title>NEET PG 2030 Plan</title>
<style>
:root{--bg:#F1F3F8;--surface:#FFFFFF;--ink:#12162B;--mute:#474C63;--line:#D3D8E6;--edge:#7B84A3;--accent:#1F2A5C;--brand:#1B2559;--onbrand:#F4F6FC;--band:#0E1330;--gold:#8E9AC7;--soft:#E6E9F3;--late:#9B2A1A;--warn:#E6EAF5;
box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0E1E;--surface:#141A33;--ink:#E8EAF4;--mute:#B8BCD2;--line:#2A3258;--edge:#7C86B8;--accent:#9FB4FF;--brand:#8FA6F5;--onbrand:#0B0E1E;--band:#0E1330;--gold:#6F7FC0;--soft:#1B2347;--late:#FF9F8A;--warn:#1B2347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0E1E;--surface:#141A33;--ink:#E8EAF4;--mute:#B8BCD2;--line:#2A3258;--edge:#7C86B8;--accent:#9FB4FF;--brand:#8FA6F5;--onbrand:#0B0E1E;--band:#0E1330;--gold:#6F7FC0;--soft:#1B2347;--late:#FF9F8A;--warn:#1B2347;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);font-size:var(--fs,100%)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
.skip{position:absolute;left:-999px;top:0;background:var(--ink);color:var(--bg);padding:.75rem 1rem;z-index:10}
.skip:focus{left:.5rem;top:.5rem}
.top{background:var(--band);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0px)}
.top .m{color:#C9CBE0}.top :focus-visible{outline-color:#F4F6FC}
header{max-width:80rem;margin:0 auto;padding:1.4rem 1rem 1.4rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap;align-items:flex-start}
h1,h2{font-family:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;letter-spacing:-.01em}
h1{font-weight:600;font-size:1.55rem;line-height:1.2;margin:0 0 .35rem;color:#F4F6FC}
h2{font-weight:600;font-size:1.5rem;line-height:1.25;margin:.5rem 0 .6rem}
h3{font:700 1.1rem/1.35 system-ui,sans-serif;margin:0}
p{margin:0 0 .6rem;max-width:70ch}.m{color:var(--mute)}
.app{display:grid;grid-template-columns:15rem 1fr;gap:1.5rem;max-width:80rem;margin:0 auto;padding:1rem}
nav{position:sticky;top:1rem;align-self:start;max-height:calc(100vh - 2rem);overflow:auto;display:flex;flex-direction:column;gap:.4rem}
nav button.n{display:flex;justify-content:space-between;gap:.5rem;text-align:left;width:100%;min-height:3rem;padding:.55rem .8rem;font:inherit;font-weight:600;color:var(--ink);background:var(--surface);border:1.5px solid var(--edge);border-radius:.7rem;cursor:pointer}
nav button.n,nav button.a{flex:none}
nav button.n span:last-child{font-weight:400;white-space:nowrap}
nav button[aria-current="page"]{background:var(--brand);color:var(--onbrand);border-color:var(--brand)}
main{min-width:0;outline:none}
.cards{display:flex;flex-direction:column;gap:.75rem}
.card.rounds{margin-bottom:.75rem}
.card{box-shadow:0 1px 3px rgba(20,24,43,.08);border:1.5px solid var(--line);border-radius:.7rem;padding:.8rem 1rem;background:var(--surface)}
.item{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.st{margin:.15rem 0 0;color:var(--mute)}.st.late{color:var(--late);font-weight:700}
button.main{font:700 1rem system-ui,sans-serif;color:var(--onbrand);background:var(--brand);border:1.5px solid var(--brand);border-radius:.7rem;padding:.6rem 1.1rem;min-height:3rem;cursor:pointer}
button.a{font:700 1rem system-ui,sans-serif;color:var(--accent);background:transparent;border:1.5px solid var(--accent);border-radius:.7rem;padding:.5rem 1rem;min-height:3rem;cursor:pointer}
details.x{margin:.3rem 0 0;border:0;background:none}
details.x summary{cursor:pointer;min-height:2.75rem;padding:.5rem 0;font-weight:600;color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
label.c{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem;padding:.3rem .7rem;border:1.5px solid var(--edge);border-radius:.7rem;cursor:pointer}
label.c:has(input:checked){border-color:var(--brand);background:var(--soft)}
input[type=checkbox]{width:1.5rem;height:1.5rem;accent-color:var(--accent);flex:none}
label.q{display:inline-flex;align-items:center;gap:.5rem;min-height:2.75rem}
input[type=number]{width:4.5rem;min-height:2.75rem;font:inherit;padding:.3rem;background:var(--bg);color:var(--ink);border:1.5px solid var(--edge);border-radius:.7rem}
.bar{background:var(--soft);height:.9rem;border:1.5px solid var(--line);border-radius:.5rem;overflow:hidden;margin:.3rem 0 1rem}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--gold))}
:focus-visible{outline:4px solid var(--accent);outline-offset:3px}
button.tb{min-height:2.75rem;min-width:2.75rem;padding:.35rem .9rem;font-size:1rem;color:#F4F6FC;background:transparent;border-color:#A9AED0}
details{border:1.5px solid var(--line);border-radius:.7rem;margin:.6rem 0;background:var(--surface)}
summary{cursor:pointer;padding:.8rem 1rem;font-weight:700;min-height:2.75rem}
summary small{font-weight:400}
.in a{color:var(--accent)}.in{padding:0 1rem .6rem}.in>:first-child{margin-top:0}.in ol,.in ul{padding-left:1.3rem;max-width:72ch}.in li{margin-bottom:.4rem}
.wrap{overflow-x:auto;border-top:1.5px solid var(--line)}
table.plan{border-collapse:collapse;width:100%}
.plan th,.plan td{padding:.6rem .8rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.plan th{background:var(--soft);color:var(--ink)}
.note{background:var(--warn);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:.7rem;padding:.6rem .9rem;margin:.5rem 0}
.due ul{list-style:none;padding:0;margin:0}
.due li{margin-bottom:.6rem;display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;border:1.5px solid var(--line);border-radius:.7rem;padding:.6rem .8rem}
.lt{color:var(--late);font-weight:700}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;max-height:none;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:.5rem .4rem;margin:-.5rem -.4rem 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button.n,nav button.a{width:auto;flex:none;border-radius:2rem;min-height:2.75rem}nav button.n span:first-child{white-space:nowrap}}
.tools{display:flex;gap:.5rem;flex-wrap:wrap}
.sel{display:none;flex:1;font-weight:700}
.sel select{display:block;width:100%;min-height:3.25rem;margin-top:.25rem;font:inherit;font-weight:600;padding:.5rem;background:var(--surface);color:var(--ink);border:1.5px solid var(--edge);border-radius:.7rem}
@media (max-width:820px){nav button.n{display:none}.sel{display:block}}
@media (max-width:560px){.item{flex-direction:column;align-items:stretch}button.main{width:100%}}
button[aria-pressed=true]{background:var(--brand);color:var(--onbrand)}
main{padding-bottom:6rem}
.x{margin-top:.4rem}
</style>
</head>

var PLAN="<details open><summary>How you learn every topic</summary><div class=\"in\">\n<ol>\n<li><b>Learn actively.</b> One teacher, one pass. Pause and predict the next point before the teacher says it.</li>\n<li><b>Same day:</b> finish with a topic-wise test on that topic. If it is short, add 10 to 20 MCQs from your QBank. Score it, and tick Topic test in the tracker.</li>\n<li><b>Every wrong answer</b> goes in an error log: the right fact and why you missed it, in one line. Tag the reason: forgot, silly mistake, or needed application (AIR 2). Each needs a different fix: revise, slow down, or practise more clinical questions.</li>\n<li><b>Facts that keep slipping</b> go in your \u201c20th notebook\u201d (see toppers below), one short line each.</li>\n<li><b>Still weak?</b> Explain the topic aloud in simple words without notes (Feynman). Where you stall is what to relearn.</li>\n<li><b>Review at 7, 21, 45, 90, 150 and 300 days.</b> Review means recalling without notes or doing a few MCQs, not rereading. These day gaps are my suggestion, not the toppers&rsquo;. They described revision rounds instead, below.</li>\n<li>After day 300, the topic comes back in your subject revision cycles, where you use your revision videos (PrepLadder RR, DAMS LRR, Cerebellum BTR). Use one of them per subject, so you don&rsquo;t repeat the same subject three times.</li>\n<li><b>Do not wait for the whole syllabus to revise.</b> After every 4 or 5 subjects, revise them before moving on (AIR 1). This sits on top of the day-based reviews above. The tracker flags it under Due today, and each subject page has Round 1 to 4 boxes once all its topics are learned.</li>\n<li><b>Use the QBank to learn first.</b> Put new facts from MCQs into your notes. Once a subject is revised once or twice, set a target for each module, such as 40 right out of 50 (AIR 1). After a mistake, go back to your notes, not only the explanation.</li>\n</ol>\n<p class=\"m\">Suggestion from me, not from toppers: put short factual items (doses, numbers, classifications) in a flashcard app that schedules reviews itself, so your time here goes to concepts.</p>\n</div></details>\n\n<details open><summary>Timeline to the June to August 2030 exam <small>approximate</small></summary><div class=\"wrap\"><table class=\"plan\">\n<tr><th scope=\"col\">Phase</th><th scope=\"col\">What to do</th></tr>\n<tr><td>Now, 3rd prof</td><td>Learn FMT, PSM, ENT, Ophthalmology with the loop. Keep earlier subjects alive with 15 to 20 MCQs a day. Start your 20th notebook now.</td></tr>\n<tr><td>Final prof</td><td>Medicine, Surgery, OBG, Paediatrics, then the short subjects, all with the loop. Revisit each earlier subject about every 3 months so none is forgotten. Add one full-syllabus GT every 3 months as a check only: expect low scores, and review errors only for subjects you have covered.</td></tr>\n<tr><td>Internship</td><td>Revision cycle 1 over all 19 subjects with your revision videos, then subject-wise PYQs, then cycle 2. One full-syllabus GT a month.</td></tr>\n<tr><td>Last 6 months</td><td>Full-syllabus GTs every 7 to 10 days (AIR 1 began about six months out). Take each at the exam&rsquo;s time of day, then review after a break: wrong answers first, then doubtful and guessed ones, then the rest. Start PYQs now too, then cycle 3. Study 7 to 8 hours a day, not more. No new resources.</td></tr>\n<tr><td>Last 30 days</td><td>Daily 20th notebook, most volatile subjects, weak topics from your error log. GTs every other day, with enough time to review each one.</td></tr>\n<tr><td>Last 8 months (AIR 2)</td><td>About 3 months of reading, about 2 months of revision, then a final 30 days. That gave her 3 to 4 revisions in this stretch.</td></tr>\n<tr><td>Every prep year</td><td>Take one month to revise all 19 subjects fast, a few times (AIR 2). It trains you to move through the whole syllabus quickly.</td></tr>\n<tr><td>Any bad day</td><td>Do something. If you cannot focus, solve 100 to 150 MCQs (AIR 1), or review for two hours. Restart the next day without catching up (AIR 2).</td></tr>\n</table></div></details>\n\n<details open><summary>What toppers say <small>from online stories</small></summary><div class=\"in\">\n<ul>\n<li><b>20th notebook:</b> one notebook, beyond your 19 subjects, for volatile facts and factual errors. Several toppers revised it daily, and it is the main thing studied in the last days.</li>\n<li><b>Rolling revision:</b> keep cycling back through every subject so none becomes a \u201cforgotten subject\u201d.</li>\n<li><b>Start revising early,</b> not after the syllabus is finished.</li>\n<li><b>Repeat reliable sources</b> instead of adding new ones.</li>\n<li><b>Review grand tests</b> by going through wrong answers first, then correct answers you guessed.</li>\n<li><b>Use revision notes first,</b> main notes for weak or frequently asked topics.</li>\n<li><b>More:</b> Marrow&rsquo;s <a href='https://www.youtube.com/playlist?list=PLaso0eqdOldY'>NEET-PG 2026 Toppers playlist</a> has 8 videos.</li>\n</ul>\n<div class=\"note\">These come from success stories published by coaching platforms (mostly PW MedEd, plus Cerebellum), and from two 2026 Marrow interviews (AIR 1 and AIR 2) as written up by Careers360. They show what some toppers did, not what works for everyone. Treat them as ideas.</div>\n</div></details>\n\n<details><summary>2026 toppers side by side <small>Marrow interviews, AIR 1 and AIR 2</small></summary><div class='wrap'><table class='plan'><tr><th scope='col'>Topic</th><th scope='col'>AIR 1, Dr Monish</th><th scope='col'>AIR 2, Dr Pallakshi</th></tr><tr><td><b>Score</b></td><td>641 of 720</td><td>633 of 720</td></tr><tr><td><b>Path</b></td><td>Second attempt: about 28,000 the first time. Serious after internship.</td><td>Worked a job alongside. Used Marrow from 3rd and 4th year.</td></tr><tr><td><b>Foundation</b></td><td>Concepts first, from Marrow main videos and notes in MBBS.</td><td>Own notes in MBBS. Read Bailey &amp; Love and S Das once, for familiarity.</td></tr><tr><td><b>Prep videos</b></td><td>Revision videos, then QBank, then custom modules.</td><td>World of Revision video, then its question set and module, one subject at a time.</td></tr><tr><td><b>Revisions</b></td><td>3 to 4 by March. Revised after every 4 or 5 subjects.</td><td>7 to 8 in all. Last 8 months: about 3 reading, about 2 revising, then a final 30 days.</td></tr><tr><td><b>QBank</b></td><td>Everything at first, PYQs from February. Targets like 40 of 50. Tags: recent NEET PG and AIIMS, image, video, clinical.</td><td>Almost everything at first, then mostly questions many students got wrong. The core set was must-get-right.</td></tr><tr><td><b>Grand tests</b></td><td>Few at first, then weekly or every 10 days from February. Stuck at 140 to 150 of 200 for a while, best about 165.</td><td>Almost every GT, on several platforms.</td></tr><tr><td><b>GT review</b></td><td>Sunday morning in exam timing, then wrong, then doubtful, then everything.</td><td>Everything at first, later wrong and guessed ones.</td></tr><tr><td><b>Pace and mood</b></td><td>7 to 8 hours a day after burning out at 10. Bad days: 100 to 150 MCQs.</td><td>Felt behind full-timers, did a little anyway, restarted next day.</td></tr></table></div><div class='in'><p><b>Where they agree:</b> concepts first; many revisions, started early; grand tests are for learning from errors, not for the score; never stop for more than a day.</p><p><b>Where they differ:</b> AIR 1 studied full-time and did most MCQs early. AIR 2 worked and prioritised hard. Both worked, so pick the style that fits your hours.</p><p><b>What I changed in your plan:</b> error reasons; revising after every 4 or 5 subjects; QBank targets; a yearly 30-day sprint; GT cadence and review order; a 7 to 8 hour cap; a bad-day rule; subject revision rounds and batch prompts in the tracker.</p><div class='note'>Only these two interviews were available to read. They are self-reports from two winners, not proof of what works. Marrow&rsquo;s other six playlist videos are not included yet.</div></div></details>\n\n";
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

function card(si,ti,openX){
  var id=si+"-"+ti,r=S[id]||{},name=tn(D[si][1][ti]),art=document.createElement("article");art.className="card";
